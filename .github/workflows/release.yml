name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      verification_ref:
        description: "Exact 40-character commit SHA to verify without publishing"
        required: true
        type: string
      inject_verifier_failure:
        description: "Dry-run only: force linux-amd64 artifact verification to fail"
        required: false
        default: false
        type: boolean

permissions:
  contents: write
  id-token: write
  attestations: write
  artifact-metadata: write

jobs:
  verify-exact-sha:
    name: Verify exact tagged SHA
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact verification SHA
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.verification_ref || github.sha }}

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Verify tag points to event SHA
        if: ${{ github.event_name == 'push' }}
        env:
          EXPECTED_SHA: ${{ github.sha }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          test "$(git rev-list -n 1 "$TAG_NAME")" = "$EXPECTED_SHA"

      - name: Verify manual exact SHA
        if: ${{ github.event_name == 'workflow_dispatch' }}
        env:
          EXPECTED_SHA: ${{ inputs.verification_ref }}
        run: |
          [[ "$EXPECTED_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"

      - name: Verify module metadata is tidy
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum

      - name: Install deterministic verification tools
        run: |
          go install mvdan.cc/gofumpt@v0.7.0
          go install golang.org/x/tools/cmd/goimports@v0.29.0
          go install golang.org/x/vuln/cmd/govulncheck@v1.8.0

      - name: Check formatting
        run: make fmt-check

      - name: Lint
        uses: golangci/golangci-lint-action@9fae48acfc02a90574d7c304a1758ef9895495fa # v7
        with:
          version: v2.12.2

      - name: Test with race detector
        run: go test -race ./...

      - name: Fuzz routing parsers
        run: |
          go test ./internal/wproxy -run '^$' -fuzz '^FuzzParseProxyCanonical$' -fuzztime=1000x
          go test ./internal/wproxy -run '^$' -fuzz '^FuzzParseNoProxyCanonical$' -fuzztime=1000x

      - name: Vet
        run: go vet ./...

      - name: Vulnerability scan
        run: govulncheck ./...

      - name: Build
        run: make build

      - name: Verify release contract
        run: ./scripts/verify-release-contract.sh

  verify-windows-native:
    name: Verify native Windows SSPI exact SHA
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.verification_ref || github.sha }}

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Run native Windows SSPI integration
        shell: pwsh
        env:
          PXGO_SSPI_NATIVE: "1"
        run: |
          $listed = (go test ./internal/proxy -list 'TCSSPIWIN(INT008|SOAK009)' | Out-String)
          if ($listed -notmatch 'TestTCSSPIWININT008' -or $listed -notmatch 'TestTCSSPIWINSOAK009') {
            throw 'exact tagged SHA is missing required native SSPI fixtures'
          }
          go test ./internal/proxy -run 'TCSSPIWIN(INT008|SOAK009)' -count=1 -v


  release-candidate:
    name: Build release candidate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [verify-exact-sha, verify-windows-native]
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      version: ${{ steps.tag.outputs.version }}
      sha: ${{ steps.tag.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.verification_ref || github.sha }}

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Install Syft
        uses: anchore/sbom-action/download-syft@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          syft-version: v1.33.0

      - name: Get release identity
        id: tag
        shell: bash
        run: |
          SHA="$(git rev-parse HEAD)"
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            EXISTING_TAG="$(git tag --points-at "$SHA" --list 'v[0-9]*' --sort=-version:refname | head -n 1)"
            TAG="v0.0.0-ap0030-dryrun-${SHA:0:12}"
            git tag "$TAG" "$SHA"
            if [[ -n "$EXISTING_TAG" ]]; then
              VERSION="${EXISTING_TAG#v}"
            else
              VERSION="${TAG#v}"
            fi
          else
            TAG="${GITHUB_REF#refs/tags/}"
            VERSION="${TAG#v}"
          fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "sha=${SHA}" >> "$GITHUB_OUTPUT"

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          version: v2.18.2
          args: release --clean --skip=publish
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Stage curated release notes
        shell: bash
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          NOTES="docs/releases/${TAG}.md"
          if [[ -f "$NOTES" ]]; then
            cp "$NOTES" dist/RELEASE_NOTES.md
          else
            cp dist/CHANGELOG.md dist/RELEASE_NOTES.md
          fi
          test -s dist/RELEASE_NOTES.md

      - name: Generate direct-install Scoop manifest
        shell: bash
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: scripts/generate-scoop-manifest.sh "$TAG" dist

      - name: Stage immutable release candidate
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-candidate-${{ steps.tag.outputs.sha }}
          path: dist
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

  verify-release-artifacts:
    name: Verify candidate (${{ matrix.name }})
    needs: release-candidate
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-amd64
            runner: ubuntu-latest
            os: linux
            arch: amd64
          - name: linux-arm64
            runner: ubuntu-24.04-arm
            os: linux
            arch: arm64
          - name: windows-amd64
            runner: windows-latest
            os: windows
            arch: amd64
          - name: macos-arm64
            runner: macos-15
            os: darwin
            arch: arm64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release-candidate.outputs.sha }}

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Download exact release candidate
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-candidate-${{ needs.release-candidate.outputs.sha }}
          path: dist

      - name: Corrupt downloaded candidate for dry-run failure proof
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.inject_verifier_failure && matrix.name == 'linux-amd64' }}
        shell: bash
        run: printf '\nAP-ISS-0030 intentional checksum corruption\n' >> dist/pxgo_linux_amd64.tar.gz

      - name: Execute exact packaged archive
        id: artifact_verify
        continue-on-error: ${{ github.event_name == 'workflow_dispatch' && inputs.inject_verifier_failure && matrix.name == 'linux-amd64' }}
        shell: bash
        env:
          TARGET_OS: ${{ matrix.os }}
          TARGET_ARCH: ${{ matrix.arch }}
          EXPECTED_VERSION: ${{ needs.release-candidate.outputs.version }}
        run: |
          go run ./scripts/verify-release-artifact.go \
            --dist dist \
            --os "$TARGET_OS" \
            --arch "$TARGET_ARCH" \
            --version "$EXPECTED_VERSION"

      - name: Assert injected artifact verification failed
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.inject_verifier_failure && matrix.name == 'linux-amd64' }}
        shell: bash
        env:
          VERIFY_OUTCOME: ${{ steps.artifact_verify.outcome }}
        run: |
          test "$VERIFY_OUTCOME" = "failure"
          echo "intentional dry-run artifact corruption was rejected by the real verifier"

  promote-release:
    name: Promote verified release candidate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [release-candidate, verify-release-artifacts]
    if: ${{ github.event_name == 'push' }}
    steps:
      - name: Download verified release candidate
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-candidate-${{ needs.release-candidate.outputs.sha }}
          path: dist

      - name: Verify staged checksums before promotion
        working-directory: dist
        run: sha256sum --check checksums.txt

      - name: Attest verified release artifacts
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-checksums: dist/checksums.txt

      - name: Promote exact verified bytes
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.release-candidate.outputs.tag }}
        run: |
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "release $TAG already exists; refusing to overwrite immutable release" >&2
            exit 1
          fi

          mapfile -t assets < <(
            {
              jq -r '.[] | select(.type == "Archive" or .type == "SBOM" or .type == "Checksum") | .path' dist/artifacts.json
              printf '%s\n' dist/pxgo-scoop.json
            } | sort
          )
          if (( ${#assets[@]} == 0 )); then
            echo "no publishable release assets found in staged candidate metadata" >&2
            exit 1
          fi
          for asset in "${assets[@]}"; do
            [[ "$asset" == dist/* && -f "$asset" ]] || {
              echo "invalid staged release asset: $asset" >&2
              exit 1
            }
          done
          test -s dist/RELEASE_NOTES.md

          release_id=""
          cleanup_draft() {
            if [[ -n "$release_id" ]]; then
              gh api --method DELETE "repos/$GITHUB_REPOSITORY/releases/$release_id" >/dev/null 2>&1 || true
            fi
          }
          trap cleanup_draft ERR

          gh release create "$TAG" "${assets[@]}" \
            --repo "$GITHUB_REPOSITORY" \
            --draft \
            --title "$TAG" \
            --notes-file dist/RELEASE_NOTES.md

          release_id=$(
            gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" |
              jq -r --arg tag "$TAG" '.[] | select(.tag_name == $tag and .draft == true) | .id' |
              head -n 1
          )
          if [[ -z "$release_id" || "$release_id" == "null" ]]; then
            echo "unable to resolve draft release id for $TAG" >&2
            exit 1
          fi

          prerelease=false
          if [[ "$TAG" == *-* ]]; then
            prerelease=true
          fi
          gh api \
            --method PATCH \
            "repos/$GITHUB_REPOSITORY/releases/$release_id" \
            -F draft=false \
            -F prerelease="$prerelease" >/dev/null

          trap - ERR

  dry-run-promotion-proof:
    name: Prove dry-run promotion is fail-closed
    runs-on: ubuntu-latest
    needs: [release-candidate, verify-release-artifacts, promote-release]
    if: ${{ always() && github.event_name == 'workflow_dispatch' }}
    steps:
      - name: Download exact candidate for draft promotion proof
        if: ${{ !inputs.inject_verifier_failure }}
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-candidate-${{ needs.release-candidate.outputs.sha }}
          path: dist

      - name: Assert verifier result and immutable draft promotion
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.release-candidate.outputs.tag }}
          SHA: ${{ needs.release-candidate.outputs.sha }}
          VERIFIER_RESULT: ${{ needs.verify-release-artifacts.result }}
          PROMOTION_RESULT: ${{ needs.promote-release.result }}
          INJECTED: ${{ inputs.inject_verifier_failure }}
        run: |
          test "$PROMOTION_RESULT" = "skipped"

          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "dry-run unexpectedly found pre-existing GitHub Release $TAG" >&2
            exit 1
          fi

          if [[ "$INJECTED" == "true" ]]; then
            test "$VERIFIER_RESULT" = "success"
            echo "dry-run failure proof passed: real verifier rejected the corrupted job-local archive, the matrix contained the expected failure, promotion=skipped, release=absent"
            exit 0
          fi

          test "$VERIFIER_RESULT" = "success"
          (cd dist && sha256sum --check checksums.txt)

          mapfile -t assets < <(
            {
              jq -r '.[] | select(.type == "Archive" or .type == "SBOM" or .type == "Checksum") | .path' dist/artifacts.json
              printf '%s\n' dist/pxgo-scoop.json
            } | sort
          )
          test "${#assets[@]}" -gt 0
          for asset in "${assets[@]}"; do
            [[ "$asset" == dist/* && -f "$asset" ]]
          done
          test -s dist/RELEASE_NOTES.md

          cleanup_draft() {
            gh release delete "$TAG" --repo "$GITHUB_REPOSITORY" --cleanup-tag --yes >/dev/null 2>&1 || true
          }
          trap cleanup_draft EXIT

          gh release create "$TAG" "${assets[@]}" \
            --repo "$GITHUB_REPOSITORY" \
            --draft \
            --latest=false \
            --target "$SHA" \
            --title "$TAG" \
            --notes-file dist/RELEASE_NOTES.md

          mkdir -p /tmp/ap0030-promoted
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --dir /tmp/ap0030-promoted

          for asset in "${assets[@]}"; do
            cmp --silent "$asset" "/tmp/ap0030-promoted/$(basename "$asset")" || {
              echo "draft promotion changed bytes for $asset" >&2
              exit 1
            }
          done

          echo "dry-run immutable promotion passed: verifier=success promotion=skipped draft-bytes=identical"

  update-homebrew-tap:
    name: Update Homebrew Tap
    runs-on: ubuntu-latest
    needs: [release-candidate, promote-release]
    if: ${{ github.event_name == 'push' && !contains(needs.release-candidate.outputs.tag, '-') && vars.PXGO_HOMEBREW_TAP_ENABLED == 'true' }}
    steps:
      - name: Update formula
        env:
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          TAG: ${{ needs.release-candidate.outputs.tag }}
        run: |
          VERSION="${TAG#v}"
          BASE_URL="https://github.com/khanhkit/pxgo/releases/download/${TAG}"

          curl --fail --silent --show-error --location "${BASE_URL}/checksums.txt" -o /tmp/checksums.txt

          SHA_DARWIN_ARM64=$(grep "pxgo_darwin_arm64.tar.gz" /tmp/checksums.txt | awk '{print $1}')
          SHA_DARWIN_AMD64=$(grep "pxgo_darwin_amd64.tar.gz" /tmp/checksums.txt | awk '{print $1}')
          SHA_LINUX_ARM64=$(grep  "pxgo_linux_arm64.tar.gz"  /tmp/checksums.txt | awk '{print $1}')
          SHA_LINUX_AMD64=$(grep  "pxgo_linux_amd64.tar.gz"  /tmp/checksums.txt | awk '{print $1}')

          git clone "https://x-access-token:${GH_TOKEN}@github.com/khanhkit/homebrew-tap.git" /tmp/tap
          mkdir -p /tmp/tap/Formula

          cat > /tmp/tap/Formula/pxgo.rb << FORMULA
          class Pxgo < Formula
            desc "HTTP/HTTPS proxy with NTLM and Kerberos authentication"
            homepage "https://github.com/khanhkit/pxgo"
            license "MIT"
            version "${VERSION}"

            on_macos do
              if Hardware::CPU.arm?
                url "${BASE_URL}/pxgo_darwin_arm64.tar.gz"
                sha256 "${SHA_DARWIN_ARM64}"
              else
                url "${BASE_URL}/pxgo_darwin_amd64.tar.gz"
                sha256 "${SHA_DARWIN_AMD64}"
              end
            end

            on_linux do
              if Hardware::CPU.arm?
                url "${BASE_URL}/pxgo_linux_arm64.tar.gz"
                sha256 "${SHA_LINUX_ARM64}"
              else
                url "${BASE_URL}/pxgo_linux_amd64.tar.gz"
                sha256 "${SHA_LINUX_AMD64}"
              end
            end

            def install
              bin.install "pxgo"
            end

            test do
              system "#{bin}/pxgo", "--version"
            end
          end
          FORMULA

          cd /tmp/tap
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Formula/pxgo.rb
          git diff --cached --quiet || git commit -m "Update pxgo to ${TAG}"
          git push
