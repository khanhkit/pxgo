name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      verification_ref:
        description: Exact branch, tag, or SHA to verify
        required: true
        type: string
        default: main
      native_sspi:
        description: Run native Windows NTLM + handle-soak fixture
        required: false
        type: boolean
        default: false
      real_ad:
        description: Run protected real-AD Negotiate/Kerberos gate
        required: false
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ inputs.verification_ref || github.sha }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.verification_ref || github.sha }}

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Install formatting tools
        if: runner.os == 'Linux'
        run: |
          go install mvdan.cc/gofumpt@v0.7.0
          go install golang.org/x/tools/cmd/goimports@v0.29.0

      - name: Verify module metadata is tidy
        if: runner.os == 'Linux'
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum

      - name: Check formatting
        if: runner.os == 'Linux'
        run: make fmt-check

      - name: Lint
        if: runner.os == 'Linux'
        uses: golangci/golangci-lint-action@9fae48acfc02a90574d7c304a1758ef9895495fa # v7
        with:
          version: v2.12.2

      - name: Vulnerability scan
        if: runner.os == 'Linux'
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.8.0
          govulncheck ./...

      - name: Test
        if: runner.os == 'Linux'
        run: make test

      - name: Fuzz routing parsers
        if: runner.os == 'Linux'
        run: |
          go test ./internal/wproxy -run '^$' -fuzz '^FuzzParseProxyCanonical$' -fuzztime=1000x
          go test ./internal/wproxy -run '^$' -fuzz '^FuzzParseNoProxyCanonical$' -fuzztime=1000x

      - name: Test
        if: runner.os == 'Windows'
        run: go test -race ./...

      - name: Native Windows SSPI integration
        if: runner.os == 'Windows' && github.event_name == 'workflow_dispatch' && inputs.native_sspi
        shell: pwsh
        env:
          PXGO_SSPI_NATIVE: "1"
        run: |
          $listed = go test ./internal/proxy -list 'TCSSPIWIN(INT008|SOAK009)'
          if ($listed -notmatch 'TestTCSSPIWININT008' -or $listed -notmatch 'TestTCSSPIWINSOAK009') {
            throw 'required native SSPI fixture tests are missing from verification_ref'
          }
          go test ./internal/proxy -run 'TCSSPIWIN(INT008|SOAK009)' -count=1 -v

      - name: Kerberos integration compile gate
        run: go test -tags=kerberos_integration ./internal/kerberos

      - name: Build
        if: runner.os == 'Linux'
        run: make build

      - name: Build
        if: runner.os == 'Windows'
        run: go build -o bin/pxgo.exe .

  windows-domain-sspi:
    name: Protected Windows AD/SSPI gate
    if: github.event_name == 'workflow_dispatch' && inputs.real_ad
    runs-on: [self-hosted, windows, x64, pxgo-ad]
    environment: pxgo-ad
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.verification_ref }}

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Verify protected AD fixture contract
        shell: pwsh
        env:
          PXGO_SSPI_AD: "1"
          PXGO_SSPI_AD_PROXY_HOST: ${{ vars.PXGO_SSPI_AD_PROXY_HOST }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:PXGO_SSPI_AD_PROXY_HOST)) {
            throw 'pxgo-ad environment must define PXGO_SSPI_AD_PROXY_HOST'
          }
          $listed = go test ./internal/proxy -list 'TCSSPIWINAD010'
          if ($listed -notmatch 'TestTCSSPIWINAD010') {
            throw 'verification_ref does not contain the required real-AD Kerberos testcase TCSSPIWINAD010'
          }
          go test ./internal/proxy -run 'TCSSPIWINAD010' -count=1 -v
