name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Install formatting tools
        if: runner.os == 'Linux'
        run: |
          go install mvdan.cc/gofumpt@v0.7.0
          go install golang.org/x/tools/cmd/goimports@v0.29.0

      - name: Check formatting
        if: runner.os == 'Linux'
        run: make fmt-check

      - name: Lint
        if: runner.os == 'Linux'
        uses: golangci/golangci-lint-action@v7
        with:
          version: v2.12.2

      - name: Test
        if: runner.os == 'Linux'
        run: make test

      - name: Native WinHTTP AP-ISS-0006 fixtures
        if: runner.os == 'Windows'
        env:
          PXGO_WINHTTP_NATIVE: "1"
        run: go test ./internal/systemproxy -run 'TCWINPAC(INT009|NEG010|NEG014|SOAK011)' -count=1 -v

      - name: Test
        if: runner.os == 'Windows'
        run: go test -race ./internal/systemproxy

      - name: Kerberos integration compile gate
        run: go test -tags=kerberos_integration ./internal/kerberos

      - name: Build
        if: runner.os == 'Linux'
        run: make build

      - name: Build
        if: runner.os == 'Windows'
        run: go build -o bin/pxgo.exe .
