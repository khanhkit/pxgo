name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      verification_ref:
        description: Exact branch, tag, or SHA to verify
        required: true
        type: string
        default: main
      native_sspi:
        description: Run native Windows NTLM + handle-soak fixture
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ inputs.verification_ref || github.sha }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.verification_ref || github.sha }}

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: false

      - name: Install formatting tools
        if: runner.os == 'Linux'
        run: |
          go install mvdan.cc/gofumpt@v0.7.0
          go install golang.org/x/tools/cmd/goimports@v0.29.0

      - name: Verify module metadata is tidy
        if: runner.os == 'Linux'
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum

      - name: Check formatting
        if: runner.os == 'Linux'
        run: make fmt-check

      - name: Lint
        if: runner.os == 'Linux'
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.12.2

      - name: Verify release contracts
        if: runner.os == 'Linux'
        run: |
          bash -n scripts/generate-scoop-manifest.sh
          ./scripts/verify-release-contract.sh
          ./scripts/verify-artifact-release-contract.sh

      - name: Vulnerability scan
        if: runner.os == 'Linux'
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.8.0
          govulncheck ./...

      - name: Test
        if: runner.os == 'Linux'
        run: make test

      - name: Large transfer integrity
        if: runner.os == 'Linux'
        run: go test ./internal/proxy -run 'Test(LargeHTTPAndHTTPS|LargeDataMultipleSizes|MixedConcurrentLargeTransfers)$' -count=1 -v

      - name: Fuzz routing parsers
        if: runner.os == 'Linux'
        run: |
          go test ./internal/wproxy -run '^$' -fuzz '^FuzzParseProxyCanonical$' -fuzztime=1000x
          go test ./internal/wproxy -run '^$' -fuzz '^FuzzParseNoProxyCanonical$' -fuzztime=1000x

      - name: Validate protected AD bootstrap PowerShell
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $path = (Resolve-Path 'scripts/bootstrap-pxgo-ad.ps1').Path
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            $path,
            [ref]$tokens,
            [ref]$errors
          ) | Out-Null
          if ($errors.Count -ne 0) {
            $errors | ForEach-Object { Write-Error $_.Message }
            throw 'protected AD bootstrap PowerShell has parser errors'
          }

      - name: Validate WinGet publisher PowerShell
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $path = (Resolve-Path 'scripts/submit-winget-release.ps1').Path
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            $path,
            [ref]$tokens,
            [ref]$errors
          ) | Out-Null
          if ($errors.Count -ne 0) {
            $errors | ForEach-Object { Write-Error $_.Message }
            throw 'WinGet publisher PowerShell has parser errors'
          }

      - name: Native WinHTTP resolver fixtures
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          PXGO_WINHTTP_NATIVE: "1"
        run: |
          $listed = (go test ./internal/systemproxy -list 'TCWINPAC(INT009|NEG010|NEG014|SOAK011)' | Out-String)
          foreach ($required in @(
            'TestTCWINPACINT009NativeExplicitPAC',
            'TestTCWINPACNEG010NativePACFailureIsNotDirect',
            'TestTCWINPACNEG014NativePACResolutionCancelsAtDeadline',
            'TestTCWINPACSOAK011NativeHandleCountReturnsNearBaseline'
          )) {
            if ($listed -notmatch [regex]::Escape($required)) {
              throw "required native WinHTTP fixture $required is missing"
            }
          }
          go test ./internal/systemproxy -run 'TCWINPAC(INT009|NEG010|NEG014|SOAK011)' -count=1 -v

      - name: Test
        if: runner.os == 'Windows'
        run: go test -race ./...

      - name: Kerberos integration compile gate
        run: go test -run '^$' -tags=kerberos_integration ./internal/kerberos

      - name: Install MIT Kerberos integration fixture
        if: runner.os == 'Linux'
        run: |
          sudo DEBIAN_FRONTEND=noninteractive apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends krb5-kdc krb5-admin-server krb5-user

      - name: Run live MIT Kerberos integration
        if: runner.os == 'Linux'
        run: ./scripts/run-kerberos-integration.sh

      - name: Build
        if: runner.os == 'Linux'
        run: make build

      - name: Install Syft for container verification
        if: runner.os == 'Linux'
        uses: anchore/sbom-action/download-syft@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          syft-version: v1.33.0

      - name: Verify hardened container runtime
        if: runner.os == 'Linux'
        run: ./scripts/verify-container-runtime.sh

      - name: Build
        if: runner.os == 'Windows'
        run: go build -o bin/pxgo.exe .

  doh-live-e2e:
    name: Live DoH E2E
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 5
    continue-on-error: ${{ github.event_name == 'pull_request' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.verification_ref || github.sha }}

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: false

      - name: Run live DoH end-to-end tests
        env:
          CI_DOH_E2E: "1"
        run: go test ./internal/dnsresolver ./internal/proxy -run '^TestDoHE2E' -count=1 -v -timeout=45s

  native-platform:
    name: Native runtime (${{ matrix.name }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-arm64
            runner: ubuntu-24.04-arm
          - name: macos-arm64
            runner: macos-15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.verification_ref || github.sha }}

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: false

      - name: Verify native architecture
        shell: bash
        run: test "$(go env GOARCH)" = arm64

      - name: Test
        run: go test ./...

      - name: Guardian process lifecycle smoke
        if: runner.os == 'macOS'
        env:
          PXGO_GUARDIAN_SOAK: "20"
        run: |
          go test ./internal/guardian \
            -run 'TCGUARDPARENT(027|028|029|030|031)|TCGUARDSOAKRepeatedReadyCrashRecycle' \
            -count=1 -v

      - name: Build
        run: go build ./...

  capacity-burst-2560:
    # Keep a heavy 2,560-connection test scoped to the capacity hotfix PR.
    # Do not impose this resource requirement on unrelated PRs or main.
    name: Capacity burst 2560 (${{ matrix.os }})
    if: github.event_name == 'pull_request' && github.head_ref == 'hotfix/performance-capacity-20261022'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 18
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Verify immutable candidate HEAD
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: false

      - name: Exercise 2560 simultaneous legacy, shadow, and AUTO CONNECTs
        shell: bash
        env:
          PXGO_CAPACITY_BURST_2560: "1"
        run: |
          for mode in legacy shadow auto; do
            echo "--- MODE: $mode (2,560 simultaneous CONNECT attempts) ---"
            PXGO_CAPACITY_BENCH_MODE="$mode" go test ./internal/proxy \
              -run '^TestCapacityBurst2560$' -count=1 -v -timeout=55s
          done

  windows-connection-class-research:
    name: Windows capacity research (${{ matrix.policy }}, classes=${{ matrix.class_mode }}, sample=${{ matrix.sample }})
    if: github.event_name == 'pull_request' && github.head_ref == 'experiment/capacity-two-class-windows-20261023'
    runs-on: windows-latest
    timeout-minutes: 24
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        policy: [r11, fast_saturation]
        class_mode: [off, 'on']
        sample: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: false
      - name: Verify SHA and collect Windows runner metadata
        shell: pwsh
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          New-Item -ItemType Directory -Force -Path benchmarks | Out-Null
          if ((git rev-parse HEAD) -ne $env:EXPECTED_SHA) { throw 'Immutable HEAD mismatch' }
          "sha=$env:EXPECTED_SHA" | Set-Content benchmarks/runner.txt
          "go=$(go version)" | Add-Content benchmarks/runner.txt
          "os=$([Environment]::OSVersion.VersionString)" | Add-Content benchmarks/runner.txt
          "logical_cpu=$([Environment]::ProcessorCount)" | Add-Content benchmarks/runner.txt
          Get-Content benchmarks/runner.txt
      - name: Native Windows R11 versus guarded fast-ramp and two-class tracking
        shell: pwsh
        env:
          PXGO_CAPACITY_BURST_2560: '1'
          PXGO_CAPACITY_BENCH_MODE: 'auto'
          PXGO_EXPERIMENTAL_CAPACITY_MODE: 'auto'
          PXGO_RESEARCH_CAPACITY_POLICY: ${{ matrix.policy }}
          PXGO_EXPERIMENTAL_CONNECTION_CLASSES: ${{ matrix.class_mode == 'on' && '1' || '0' }}
        run: |
          # Bounded SYN waves isolate 2,560 simultaneously held live tunnels
          # from the separate known Windows SOMAXCONN 2,560-SYN burst limit.
          $env:PXGO_CAPACITY_SYN_SPIKE = '0'
          # Four independent samples, each on a FRESH Windows VM. Previously
          # chaining four 2,560-tunnel soaks polluted later runs with TCP
          # endpoint/WSAENOBUFS pressure. Do not waive any failed socket.
          go test ./internal/proxy -run '^TestCapacityBurst2560$' -count=1 -v -timeout=70s 2>&1 |
            Tee-Object -FilePath "benchmarks/2560-sample-${{ matrix.sample }}.log"
          if ($LASTEXITCODE -ne 0) { throw "2560 native Windows live-tunnel sample ${{ matrix.sample }} FAILED" }
      - name: Preserve benchmark and failure evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: win-capacity-${{ matrix.policy }}-classes-${{ matrix.class_mode }}-sample-${{ matrix.sample }}-${{ github.event.pull_request.head.sha }}
          path: benchmarks/
          retention-days: 14

  windows-mixed-capacity-research:
    name: Windows mixed (${{ matrix.policy }}, classes=${{ matrix.class_mode }}, seed=${{ matrix.seed }})
    # Each seed gets a FRESH VM. Native Windows has a finite ephemeral TCP
    # port range and TIME_WAIT. Chaining 4 x 2560 CONNECT soak + all eight
    # mixed seeds in one VM exhausted outgoing ephemeral ports (WSAEADDRINUSE).
    # Do not mislabel test-runner exhaustion as controller failure, and never
    # bypass it by forcing abortive RST closes in realistic short-conn tests.
    if: github.event_name == 'pull_request' && github.head_ref == 'experiment/capacity-two-class-windows-20261023'
    runs-on: windows-latest
    timeout-minutes: 17
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        policy: [r11, fast_saturation]
        class_mode: [off, 'on']
        seed: [0, 1, 2, 3, 4, 5, 6, 7]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: false
      - name: Verify immutable SHA and Windows runner profile
        shell: pwsh
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          New-Item -ItemType Directory -Force -Path benchmarks | Out-Null
          if ((git rev-parse HEAD) -ne $env:EXPECTED_SHA) { throw 'Immutable HEAD mismatch' }
          "sha=$env:EXPECTED_SHA" | Set-Content benchmarks/runner.txt
          "go=$(go version)" | Add-Content benchmarks/runner.txt
          "os=$([Environment]::OSVersion.VersionString)" | Add-Content benchmarks/runner.txt
          "logical_cpu=$([Environment]::ProcessorCount)" | Add-Content benchmarks/runner.txt
          "seed=${{ matrix.seed }} policy=${{ matrix.policy }} classes=${{ matrix.class_mode }}" | Add-Content benchmarks/runner.txt
          Get-Content benchmarks/runner.txt
          # Capture ephemeral-port range before the high-socket-count test;
          # no OS port-range mutation or insecure SO_REUSEADDR workaround.
          netsh interface ipv4 show dynamicport tcp 2>&1 |
            Out-File -FilePath benchmarks/windows-ephemeral-range-before.txt
          netsh interface ipv6 show dynamicport tcp 2>&1 |
            Add-Content benchmarks/windows-ephemeral-range-before.txt
      - name: Concurrent short/long workload and admission competition
        shell: pwsh
        env:
          PXGO_CAPACITY_MIXED_BENCH: '1'
          PXGO_EXPERIMENTAL_CAPACITY_MODE: 'auto'
          PXGO_CAPACITY_MIX_SEED: ${{ matrix.seed }}
          PXGO_RESEARCH_CAPACITY_POLICY: ${{ matrix.policy }}
          PXGO_EXPERIMENTAL_CONNECTION_CLASSES: ${{ matrix.class_mode == 'on' && '1' || '0' }}
        run: |
          # On seed0, run class lifecycle BEFORE the high-socket-count load.
          # The heavy 4x2560 test runner has no ephemeral TCP ports left by
          # its end; putting lifecycle tests there produced WSAEADDRINUSE.
          if ($env:PXGO_CAPACITY_MIX_SEED -eq '0') {
            go test ./internal/proxy -run '^TestConnectionClass' -count=5 -v -timeout=60s 2>&1 |
              Tee-Object -FilePath benchmarks/class-lifecycle.log
            if ($LASTEXITCODE -ne 0) { throw 'Windows class lifecycle failed on fresh runner' }
            go test ./internal/proxy -run '^$' -bench '^BenchmarkConnectionClass' -benchmem -count=3 2>&1 |
              Tee-Object -FilePath benchmarks/class-microbenchmark.log
            if ($LASTEXITCODE -ne 0) { throw 'Windows class microbenchmarks failed on fresh runner' }
          }
          # R23: verify actual TLS 1.3 + ALPN h2 multiplexing, six SSE
          # streams, shared physical 16-slot saturation and long-to-short
          # permit reclamation on a fresh native Windows VM. Only seed 0:
          # four policy/class cells, before the heavy socket churn below.
          if ($env:PXGO_CAPACITY_MIX_SEED -eq '0') {
            $env:PXGO_CAPACITY_TLS_H2_BENCH = '1'
            go test ./internal/proxy -run '^TestCapacityTLSHTTP2StreamingMixed$' -count=1 -v -timeout=65s 2>&1 |
              Tee-Object -FilePath benchmarks/tls-h2-streaming.log
            if ($LASTEXITCODE -ne 0) { throw 'Native TLS 1.3/HTTP2/SSE and saturated permit borrowing failed' }
            # A silently SKIPPED test must never count as native research PASS.
            if (-not (Select-String -Path benchmarks/tls-h2-streaming.log -Pattern 'TLS_H2_RESULT tls=tls13 alpn=h2 admission_wait_proven=true wait_delta=[1-9][0-9]*')) {
              throw 'Missing strict TLS/H2/observed-global-wait evidence marker'
            }
            Remove-Item Env:PXGO_CAPACITY_TLS_H2_BENCH
          }
          # R25 WebSocket RFC6455 binary-frame classification and strict
          # 16/16 physical saturation/short borrowing, before port churn.
          # Exactly four native windows-latest seed0 policy/class cells.
          if ($env:PXGO_CAPACITY_MIX_SEED -eq '0') {
            $env:PXGO_CAPACITY_WS_BENCH = '1'
            go test ./internal/proxy -run '^TestCapacityMixedWebSocketSaturated$' -count=1 -v -timeout=65s 2>&1 |
              Tee-Object -FilePath benchmarks/websocket-saturated.log
            if ($LASTEXITCODE -ne 0) { throw 'Native WebSocket frame and physical borrowing gate failed' }
            if (-not (Select-String -Path benchmarks/websocket-saturated.log -Pattern 'WS_MIXED_RESULT websocket=8 connect=8 short_borrow=1 wait_delta=[1-9][0-9]* global_active=0')) {
              throw 'WebSocket evidence marker absent or zero actual admission waits'
            }
            Remove-Item Env:PXGO_CAPACITY_WS_BENCH
          }
          # Short/medium/long TCP survival (250ms..5.5s), natural releases,
          # short HTTP churn during every phase and no physical/class leaks.
          # Run FIRST on a fresh Windows VM to avoid contaminating results
          # with prior TIME_WAIT/ephemeral port pressure.
          # Enforce an ACTUALLY saturated global physical limit of 64 long
          # CONNECTs. Four real short HTTP arrivals must block until a long
          # tunnel frees a permit, then complete and replenish the long pool.
          go test ./internal/proxy -run '^TestCapacityShortBorrowsReleasedLongPermit$' -count=1 -v -timeout=55s 2>&1 |
            Tee-Object -FilePath benchmarks/strict-64-permit-borrowing.log
          if ($LASTEXITCODE -ne 0) { throw 'Hard-saturated long-to-short permit borrowing failed' }
          go test ./internal/proxy -run '^TestCapacityMixedStaggeredLifetimes$' -count=1 -v -timeout=65s 2>&1 |
            Tee-Object -FilePath benchmarks/staggered-lifetimes.log
          if ($LASTEXITCODE -ne 0) { throw 'Real short/medium/long lifetime turnover failed' }
          # Active bidirectional relays (1 KiB-256 KiB frames and one 10 MiB
          # bulk transfer) compete with short HTTP 128 B-64 KiB responses.
          # Long and short classes share physical FD/Job headroom. Verify
          # p95/p99 and 100% exact payload integrity on the native Win runner.
          go test ./internal/proxy -run '^TestCapacityMixedActivePayload$' -count=1 -v -timeout=90s 2>&1 |
            Tee-Object -FilePath benchmarks/active-long-short-data-plane.log
          if ($LASTEXITCODE -ne 0) { throw 'Concurrent long data-plane and short HTTP integrity/fairness gate failed' }
          go test ./internal/proxy -run '^TestCapacityMixedTrafficBench$' -count=1 -v -timeout=125s 2>&1 |
            Tee-Object -FilePath benchmarks/mixed-profiles.log
          if ($LASTEXITCODE -ne 0) { throw 'Mixed profiles did not meet native Windows live-tunnel/HTTP integrity gates' }
          go test ./internal/proxy -run '^TestCapacityMixedCompetingAdmission$' -count=1 -v -timeout=70s 2>&1 |
            Tee-Object -FilePath benchmarks/mixed-competing-arrival.log
          if ($LASTEXITCODE -ne 0) { throw 'Concurrent short+long admission gate failed' }
          if ($env:PXGO_EXPERIMENTAL_CONNECTION_CLASSES -eq '1' -and $env:PXGO_CAPACITY_MIX_SEED -eq '0') {
            $env:PXGO_CAPACITY_AGING_SOAK = '1'
            go test ./internal/proxy -run '^TestCapacityMixedRealTimeAgedShortToLong$' -count=1 -v -timeout=55s 2>&1 |
              Tee-Object -FilePath benchmarks/real-clock-30s-promotion.log
            if ($LASTEXITCODE -ne 0) { throw 'Live 30s idle keepalive promotion failed' }
          }
      - name: Capture Windows TCP state and port exhaustion diagnostics
        if: always()
        shell: pwsh
        run: |
          # Runs even if a mixed profile failed on WSAEADDRINUSE. Diagnostics
          # are evidence only, not a PASS waiver and never change socket state.
          New-Item -ItemType Directory -Force -Path benchmarks | Out-Null
          $out = 'benchmarks/windows-tcp-after.txt'
          "utc=$([DateTime]::UtcNow.ToString('o'))" | Set-Content $out
          try {
            '--- IPv4 dynamic ports ---' | Add-Content $out
            netsh interface ipv4 show dynamicport tcp 2>&1 | Add-Content $out
            '--- IPv6 dynamic ports ---' | Add-Content $out
            netsh interface ipv6 show dynamicport tcp 2>&1 | Add-Content $out
            '--- TCP state counts ---' | Add-Content $out
            $connections = @(Get-NetTCPConnection -ErrorAction Stop)
            $connections | Group-Object State | Sort-Object Name |
              ForEach-Object { "state=$($_.Name) count=$($_.Count)" } | Add-Content $out
            '--- TIME_WAIT loopback endpoints (sample up to 24) ---' | Add-Content $out
            $connections | Where-Object { $_.State -eq 'TimeWait' -and $_.LocalAddress -in @('127.0.0.1','::1') } |
              Select-Object -First 24 LocalAddress,LocalPort,RemoteAddress,RemotePort,State |
              Format-Table -AutoSize | Out-String | Add-Content $out
          } catch {
            "TCP_DIAGNOSTICS_UNAVAILABLE: $($_.Exception.Message)" | Add-Content $out
          }
          Get-Content $out
      - name: Preserve native Windows evidence, including failures
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: win-mixed-${{ matrix.policy }}-${{ matrix.class_mode }}-seed-${{ matrix.seed }}-${{ github.event.pull_request.head.sha }}
          path: benchmarks/
          retention-days: 14

  windows-mixed-socket-isolation-research:
    name: Windows isolated socket gate (${{ matrix.scenario }}, trial=${{ matrix.trial }})
    if: github.event_name == 'pull_request' && github.head_ref == 'experiment/capacity-two-class-windows-20261023'
    runs-on: windows-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        scenario: [r11_off_seed6_churn, fast_on_seed1_competing]
        trial: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: false
      - name: Exact native isolated failed-profile trial with TCP lifecycle diagnostics
        shell: pwsh
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha }}
          SCENARIO: ${{ matrix.scenario }}
          TRIAL: ${{ matrix.trial }}
          PXGO_EXPERIMENTAL_CAPACITY_MODE: auto
          PXGO_CAPACITY_MIXED_BENCH: '1'
        run: |
          New-Item -ItemType Directory -Force -Path benchmarks | Out-Null
          if ((git rev-parse HEAD) -ne $env:EXPECTED_SHA) { throw 'Exact R34 SHA mismatch' }
          @('scenario=' + $env:SCENARIO, 'trial=' + $env:TRIAL, 'exact_sha=' + $env:EXPECTED_SHA) | Set-Content benchmarks/trial-metadata.txt
          netsh int ipv4 show dynamicport tcp 2>&1 | Out-File benchmarks/port-range-before.txt
          (Get-NetTCPConnection -ErrorAction SilentlyContinue | Group-Object State |
            ForEach-Object { 'state=' + $_.Name + ' count=' + $_.Count }) | Out-File benchmarks/tcp-states-before.txt
          try {
            if ($env:SCENARIO -eq 'r11_off_seed6_churn') {
              $env:PXGO_CAPACITY_MIX_SEED = '6'
              $env:PXGO_RESEARCH_CAPACITY_POLICY = 'r11'
              $env:PXGO_EXPERIMENTAL_CONNECTION_CLASSES = '0'
              $env:PXGO_CAPACITY_MIX_PROFILE = 'churn'
              go test ./internal/proxy -run '^TestCapacityMixedTrafficBench/churn$' -count=1 -v -timeout=115s 2>&1 |
                Tee-Object -FilePath benchmarks/isolated-mixed-test.log
              if ($LASTEXITCODE -ne 0) { throw 'R11 OFF seed6 strict isolated churn failed; no waiver' }
              if (-not (Select-String benchmarks/isolated-mixed-test.log -Pattern 'MIXED_RESULT profile=churn seed=6 held_long_connect=449 .* short_attempted=1404 short_completed=1404')) {
                throw 'Missing complete native seed6 churn positive data-plane result'
              }
            } elseif ($env:SCENARIO -eq 'fast_on_seed1_competing') {
              $env:PXGO_CAPACITY_MIX_SEED = '1'
              $env:PXGO_RESEARCH_CAPACITY_POLICY = 'fast_saturation'
              $env:PXGO_EXPERIMENTAL_CONNECTION_CLASSES = '1'
              go test ./internal/proxy -run '^TestCapacityMixedCompetingAdmission$' -count=1 -v -timeout=115s 2>&1 |
                Tee-Object -FilePath benchmarks/isolated-mixed-test.log
              if ($LASTEXITCODE -ne 0) { throw 'FAST ON seed1 strict isolated competing admission failed; no waiver' }
              if (-not (Select-String benchmarks/isolated-mixed-test.log -Pattern 'MIXED_COMPETE_RESULT seed=1 long_attempted=320 long_admitted=320 short_attempted=448 short_completed=448')) {
                throw 'Missing complete native seed1 competing positive result'
              }
            } else {
              throw 'Unsupported native socket reproduction scenario'
            }
          } finally {
            (Get-NetTCPConnection -ErrorAction SilentlyContinue | Group-Object State |
              ForEach-Object { 'state=' + $_.Name + ' count=' + $_.Count }) | Out-File benchmarks/tcp-states-after.txt
            netsh int ipv4 show dynamicport tcp 2>&1 | Out-File benchmarks/port-range-after.txt
            try {
              Get-WinEvent -FilterHashtable @{LogName='System'; ID=4227,4231; StartTime=(Get-Date).AddMinutes(-15)} -MaxEvents 20 -ErrorAction Stop |
                Format-List TimeCreated,Id,ProviderName,Message | Out-File benchmarks/tcp-recent-events.txt
            } catch {
              'No readable matching Event IDs in last 15 min: ' + $_.Exception.Message | Out-File benchmarks/tcp-recent-events.txt
            }
          }
      - name: Preserve exact SHA Windows TCP diagnostic artifacts on success and failure
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: win-socket-isolated-${{ matrix.scenario }}-${{ matrix.trial }}-${{ github.event.pull_request.head.sha }}
          path: benchmarks/
          retention-days: 14

  windows-job-proxy-2560-matrix:
    name: Windows real PxGo quota (${{ matrix.policy }}, classes=${{ matrix.class_mode }}, trial=${{ matrix.trial }})
    # Each policy/class/trial on a fresh native Windows VM; descriptive, unpaired.
    if: github.event_name == 'pull_request' && github.head_ref == 'experiment/capacity-two-class-windows-20261023'
