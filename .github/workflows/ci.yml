  capacity-order-balanced-evidence:
    name: Capacity paired order-balance evidence audit
    # Validate the *pinned* R20 native Windows measurement replay; R22 only
    # computes a noncausal descriptive order-balanced analysis, never fabricates
    # fresh native Windows measurements from a Python script.
    if: github.event_name == 'pull_request' && github.head_ref == 'experiment/capacity-two-class-windows-20261023'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Verify exact candidate SHA and adversarial data fixtures
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          python3 -m unittest discover -s scripts -p 'analyze_capacity_crossover_test.py' -v
      - name: Recompute and compare pinned R20 cross-order report
        shell: bash
        run: |
          set -euo pipefail
          output="$(mktemp)"
          trap 'rm -f "$output"' EXIT
          python3 scripts/analyze-capacity-crossover.py \
            --input docs/research/2026-10-26-r20-native-windows-paired-replay.csv \
            --expected-sha 22d05d66d06538c1e00cd4b6d9474be6a36c7a49 \
            --output "$output"
          cmp -- "$output" docs/research/2026-10-27-r22-order-balanced-study.json

  windows-paired-policy-research:
    name: Windows paired (${{ matrix.profile }}, classes=${{ matrix.class_mode }}, seed=${{ matrix.seed }}, order=${{ matrix.order }})
    # Controlled same-runner paired R11 versus fast-saturation. Previous
    # independent-VM matrix reported policy-dependent p95 distributions but
    # did not provide a comparable-host causal comparison. Run both policies
    # as separate processes on ONE immutable Windows VM, same exact seed,
    # same profile and Go test binary; reverse order by seed parity.
    # Fully cross each SAME seed with BOTH orders on separate fresh VMs,
    # rather than confounding policy order and offered-load seed parity.
    # Keep only two matched workloads per fresh VM to limit native Windows
    # loopback ephemeral-port/TIME_WAIT contamination. No PASS waiver.
    if: github.event_name == 'pull_request' && github.head_ref == 'experiment/capacity-two-class-windows-20261023'
    runs-on: windows-latest
    timeout-minutes: 16
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        profile: [short_heavy, balanced, long_heavy, churn]
        class_mode: [off, 'on']
        seed: [0, 1]
        order: [r11_first, fast_first]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: false
      - name: Compile immutable paired test binary and identify runner
        shell: pwsh
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          New-Item -ItemType Directory -Force -Path benchmarks | Out-Null
          if ((git rev-parse HEAD) -ne $env:EXPECTED_SHA) { throw 'Exact-SHA checkout mismatch' }
          "sha=$env:EXPECTED_SHA" | Set-Content benchmarks/runner.txt
          "go=$(go version)" | Add-Content benchmarks/runner.txt
          "os=$([Environment]::OSVersion.VersionString)" | Add-Content benchmarks/runner.txt
          "cpu_count=$([Environment]::ProcessorCount)" | Add-Content benchmarks/runner.txt
          "python=$(python --version 2>&1)" | Add-Content benchmarks/runner.txt
          "profile=${{ matrix.profile }} seed=${{ matrix.seed }} classes=${{ matrix.class_mode }} order=${{ matrix.order }}" | Add-Content benchmarks/runner.txt
          go test ./internal/proxy -c -o benchmarks/capacity-paired.test.exe
          if ($LASTEXITCODE -ne 0) { throw 'Exact-SHA native Windows test build failed' }
          # Exercise the compiled binary's real Go flags before any workload.
          & .\benchmarks\capacity-paired.test.exe '-test.list=^TestCapacityMixedTrafficBench$' > benchmarks/test-list.txt
          if ($LASTEXITCODE -ne 0 -or -not (Select-String -Path benchmarks/test-list.txt -Pattern '^TestCapacityMixedTrafficBench$')) {
            throw 'Native compiled Go test flag preflight failed'
          }
          netsh interface ipv4 show dynamicport tcp 2>&1 | Out-File benchmarks/ephemeral-before.txt
      - name: Validate paired log parser negative fixtures
        shell: pwsh
        run: |
          python -m unittest discover -s scripts -p 'verify_capacity_pair_test.py' -v
          if ($LASTEXITCODE -ne 0) { throw 'Strict paired-log validator negative tests failed' }
      - name: Same-host paired HTTP/CONNECT p95, p99 and throughput
        shell: pwsh
        env:
          PXGO_EXPERIMENTAL_CAPACITY_MODE: 'auto'
          PXGO_EXPERIMENTAL_CONNECTION_CLASSES: ${{ matrix.class_mode == 'on' && '1' || '0' }}
          PXGO_CAPACITY_MIXED_BENCH: '1'
          PXGO_CAPACITY_MIX_PROFILE: ${{ matrix.profile }}
          PXGO_CAPACITY_MIX_SEED: ${{ matrix.seed }}
        run: |
          $policies = @('r11', 'fast_saturation')
          if ('${{ matrix.order }}' -eq 'fast_first') { $policies = @('fast_saturation', 'r11') }
          foreach ($policy in $policies) {
            $env:PXGO_RESEARCH_CAPACITY_POLICY = $policy
            $timewaitBefore = try { @(Get-NetTCPConnection -State TimeWait -ErrorAction Stop).Count } catch { -1 }
            "PAIR_POLICY profile=${{ matrix.profile }} class=${{ matrix.class_mode }} seed=${{ matrix.seed }} policy=$policy timewait_before=$timewaitBefore" |
              Add-Content benchmarks/paired-order.txt
            # Quoted, full Go flags are required when invoking a native .exe
            # from PowerShell. Original unquoted `-test.run` was split into
            # `-test`, which made all R17 Windows paired jobs fail at startup.
            $testArgs = @('-test.run=^TestCapacityMixedTrafficBench$', '-test.v=true', '-test.count=1', '-test.timeout=95s')
            & .\benchmarks\capacity-paired.test.exe @testArgs 2>&1 |
              Tee-Object -FilePath "benchmarks/paired-$policy.log"
            if ($LASTEXITCODE -ne 0) { throw "Paired profile failed: $policy" }
          }
          # Parse and compare complete typed measurements, not just a PASS
          # line or an unbound short count. The stdlib-only validator contains
          # negative fixtures and is itself tested in a separate step.
          python scripts/verify-capacity-pair.py `
            --profile '${{ matrix.profile }}' --seed '${{ matrix.seed }}' `
            --classes '${{ matrix.class_mode }}' --order '${{ matrix.order }}' `
            --order-log benchmarks/paired-order.txt `
            --r11 benchmarks/paired-r11.log `
            --fast benchmarks/paired-fast_saturation.log `
            --output benchmarks/paired-evidence.json
          if ($LASTEXITCODE -ne 0) { throw 'Matched workload evidence is missing, malformed or unequal' }
      - name: Diagnose native Windows TCP state after paired runs
        if: always()
        shell: pwsh
        run: |
          try {
            $tcp = @(Get-NetTCPConnection -ErrorAction Stop)
            $tcp | Group-Object State | Sort-Object Name |
              ForEach-Object { "state=$($_.Name) count=$($_.Count)" } |
              Out-File benchmarks/ephemeral-after.txt
          } catch {
            "TCP_STATE_UNAVAILABLE: $($_.Exception.Message)" | Out-File benchmarks/ephemeral-after.txt
          }
      - name: Preserve paired evidence even on failure
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: win-paired-${{ matrix.profile }}-${{ matrix.class_mode }}-seed-${{ matrix.seed }}-${{ matrix.order }}-${{ github.event.pull_request.head.sha }}
          path: |
            benchmarks/*.txt
            benchmarks/*.json
          retention-days: 14
      - name: Preserve paired raw logs even on failure
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: win-paired-logs-${{ matrix.profile }}-${{ matrix.class_mode }}-seed-${{ matrix.seed }}-${{ matrix.order }}-${{ github.event.pull_request.head.sha }}
          path: benchmarks/*.log
          retention-days: 14

  windows-isolated-process-capacity:
    name: Windows isolated proxy (${{ matrix.policy }}, classes=${{ matrix.classes }}, seed=${{ matrix.seed }})
    # Proxy-only private commit/RSS/handle/CPU. Distinct child PID, separate
    # client+upstream parent; never infer these values from co-located heap.
    # Seed 3 measures 2,560 real held CONNECTs plus 600 short HTTP on a
    # dedicated fresh Windows VM, not an extrapolation from 256–384.
    if: github.event_name == 'pull_request' && github.head_ref == 'experiment/capacity-two-class-windows-20261023'
    runs-on: windows-latest
    timeout-minutes: 14
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        policy: [r11, fast_saturation]
        classes: [off, 'on']
        seed: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: false
      - name: Immutable SHA and Windows identity
        shell: pwsh
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          New-Item -ItemType Directory -Force -Path benchmarks | Out-Null
          if ((git rev-parse HEAD) -ne $env:EXPECTED_SHA) { throw 'Immutable HEAD mismatch' }
          "sha=$env:EXPECTED_SHA" | Set-Content benchmarks/isolated-runner.txt
          "go=$(go version)" | Add-Content benchmarks/isolated-runner.txt
          "os=$([Environment]::OSVersion.VersionString)" | Add-Content benchmarks/isolated-runner.txt
          "logical_cpu=$([Environment]::ProcessorCount)" | Add-Content benchmarks/isolated-runner.txt
          Get-Content benchmarks/isolated-runner.txt
      - name: Real mixed-load with native process-private resource accounting
        shell: pwsh
        env:
          PXGO_CAPACITY_ISOLATED_BENCH: '1'
          PXGO_CAPACITY_ISOLATED_SEED: ${{ matrix.seed }}
          PXGO_EXPERIMENTAL_CAPACITY_MODE: 'auto'
          PXGO_EXPERIMENTAL_CONNECTION_CLASSES: ${{ matrix.classes == 'on' && '1' || '0' }}
          PXGO_RESEARCH_CAPACITY_POLICY: ${{ matrix.policy }}
        run: |
          go test ./internal/proxy -run '^TestCapacityIsolatedProcessResourceBench$' -count=1 -v -timeout=110s 2>&1 |
            Tee-Object -FilePath benchmarks/isolated-proxy-process.log
          if ($LASTEXITCODE -ne 0) { throw 'Native isolated PXGO process or resource gate failed' }
          if (-not (Select-String -Path benchmarks/isolated-proxy-process.log -Pattern 'ISOLATED_RESULT platform=windows' -Quiet)) {
            throw 'Required native Windows process-private metric row is absent'
          }
          if ($env:PXGO_EXPERIMENTAL_CONNECTION_CLASSES -eq '1' -and $env:PXGO_CAPACITY_ISOLATED_SEED -eq '0') {
            $env:PXGO_CAPACITY_ISOLATED_CLEANUP_TEST = '1'
            go test ./internal/proxy -run '^TestCapacityIsolatedForcedFailureCleanup$' -count=1 -v -timeout=25s 2>&1 |
              Tee-Object -FilePath benchmarks/isolated-negative-cleanup.log
            if ($LASTEXITCODE -ne 0) { throw 'Real early-failure socket cleanup/deadlock gate failed' }
          }
      - name: Capture Winsock port and socket-state diagnostics on failure
        if: failure()
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path benchmarks | Out-Null
          try { netsh int ipv4 show dynamicport tcp 2>&1 | Out-String | Set-Content benchmarks/windows-tcp-dynamic-range.txt } catch { "netsh unavailable: $_" | Set-Content benchmarks/windows-tcp-dynamic-range.txt }
          try {
            Get-NetTCPConnection -ErrorAction Stop |
              Group-Object State | Sort-Object Name |
              Select-Object Name,Count | Format-Table -AutoSize | Out-String |
              Set-Content benchmarks/windows-tcp-state-counts.txt
          } catch { "TCP states unavailable: $_" | Set-Content benchmarks/windows-tcp-state-counts.txt }
      - name: Preserve SHA-qualified isolated process evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: win-isolated-${{ matrix.policy }}-${{ matrix.classes }}-seed-${{ matrix.seed }}-${{ github.event.pull_request.head.sha }}
          path: benchmarks/
          retention-days: 14

  windows-native-sspi:
    name: Native Windows SSPI gate
    if: github.event_name == 'workflow_dispatch' && inputs.native_sspi
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.verification_ref }}

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: false

      - name: Run native Windows SSPI integration
        shell: pwsh
        env:
          PXGO_SSPI_NATIVE: "1"
        run: |
          $listed = (go test ./internal/proxy -list 'TCSSPIWIN(INT008|SOAK009)' | Out-String)
          if ($listed -notmatch 'TestTCSSPIWININT008' -or $listed -notmatch 'TestTCSSPIWINSOAK009') {
            throw 'required native SSPI fixture tests are missing from verification_ref'
          }
          go test ./internal/proxy -run 'TCSSPIWIN(INT008|SOAK009)' -count=1 -v
