          if (-not (Select-String -Path benchmarks/windows-job-proxy-matrix.log -Pattern 'JOB_PROXY_OWN_JOBINFO verified=true child_pid=[1-9][0-9]* process_commit_limit=[1-9][0-9]*')) { throw 'Child itself did not prove Job Object cap' }
          if (-not (Select-String -Path benchmarks/windows-job-proxy-matrix.log -Pattern 'JOB_PROXY_2560_RESULT enforceable=true pid=[1-9][0-9]* held=2560 completed_short=600 denied_bytes=268435456 recovered_bytes=4194304 .* physical_after=0')) {
            throw 'Missing genuine native quota/held-connection positive marker'
          }
      - name: Preserve per-trial Windows raw logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: win-real-proxy-quota-${{ matrix.policy }}-${{ matrix.class_mode }}-${{ matrix.trial }}-${{ github.event.pull_request.head.sha }}
          path: benchmarks/
          retention-days: 14

