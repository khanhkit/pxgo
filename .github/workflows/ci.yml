name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      verification_ref:
        description: Exact branch, tag, or SHA to verify
        required: true
        type: string
        default: main
      native_sspi:
        description: Run native Windows NTLM + handle-soak fixture
        required: false
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ inputs.verification_ref || github.sha }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.verification_ref || github.sha }}

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Install formatting tools
        if: runner.os == 'Linux'
        run: |
          go install mvdan.cc/gofumpt@v0.7.0
          go install golang.org/x/tools/cmd/goimports@v0.29.0

      - name: Verify module metadata is tidy
        if: runner.os == 'Linux'
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum

      - name: Check formatting
        if: runner.os == 'Linux'
        run: make fmt-check

      - name: Lint
        if: runner.os == 'Linux'
        uses: golangci/golangci-lint-action@9fae48acfc02a90574d7c304a1758ef9895495fa # v7
        with:
          version: v2.12.2

      - name: Vulnerability scan
        if: runner.os == 'Linux'
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.8.0
          govulncheck ./...

      - name: Test
        if: runner.os == 'Linux'
        run: make test

      - name: Fuzz routing parsers
        if: runner.os == 'Linux'
        run: |
          go test ./internal/wproxy -run '^$' -fuzz '^FuzzParseProxyCanonical$' -fuzztime=1000x
          go test ./internal/wproxy -run '^$' -fuzz '^FuzzParseNoProxyCanonical$' -fuzztime=1000x

      - name: Validate protected AD bootstrap PowerShell
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $path = (Resolve-Path 'scripts/bootstrap-pxgo-ad.ps1').Path
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            $path,
            [ref]$tokens,
            [ref]$errors
          ) | Out-Null
          if ($errors.Count -ne 0) {
            $errors | ForEach-Object { Write-Error $_.Message }
            throw 'protected AD bootstrap PowerShell has parser errors'
          }

      - name: Test
        if: runner.os == 'Windows'
        run: go test -race ./...

      - name: Kerberos integration compile gate
        run: go test -tags=kerberos_integration ./internal/kerberos

      - name: Build
        if: runner.os == 'Linux'
        run: make build

      - name: Install Syft for container verification
        if: runner.os == 'Linux'
        uses: anchore/sbom-action/download-syft@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          syft-version: v1.33.0

      - name: Verify hardened container runtime
        if: runner.os == 'Linux'
        run: ./scripts/verify-container-runtime.sh

      - name: Build
        if: runner.os == 'Windows'
        run: go build -o bin/pxgo.exe .

  windows-native-sspi:
    name: Native Windows SSPI gate
    if: github.event_name == 'workflow_dispatch' && inputs.native_sspi
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.verification_ref }}

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Run native Windows SSPI integration
        shell: pwsh
        env:
          PXGO_SSPI_NATIVE: "1"
        run: |
          $listed = (go test ./internal/proxy -list 'TCSSPIWIN(INT008|SOAK009)' | Out-String)
          if ($listed -notmatch 'TestTCSSPIWININT008' -or $listed -notmatch 'TestTCSSPIWINSOAK009') {
            throw 'required native SSPI fixture tests are missing from verification_ref'
          }
          go test ./internal/proxy -run 'TCSSPIWIN(INT008|SOAK009)' -count=1 -v
