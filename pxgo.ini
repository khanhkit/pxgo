[proxy]

; Upstream proxy server(s), comma separated.
; Examples:
;   proxy.company.com:8080
;   http://proxy.company.com:8080
;   socks5://127.0.0.1:1080
server =

; PAC file URL or local file path. Use instead of server when a PAC file should
; select the upstream proxy.
pac =

; PAC file encoding.
pac_encoding = auto

; Local interface(s) to listen on. Comma separated.
listen = 127.0.0.1

; Local proxy port.
port = 3128

; Bind all interfaces so remote clients can connect.
gateway = 0

; Bind all interfaces but allow only IPs assigned to local host interfaces.
hostonly = 0

; Client IP allow list used by gateway mode. Supports exact IPs, wildcard IPv4
; globs, IPv4 ranges, and CIDR ranges.
allow = *.*.*.*

; Destinations that bypass the upstream proxy. Supports exact IPs, wildcard
; IPv4 globs, IPv4 ranges, CIDR ranges, and host/domain suffixes.
noproxy =

; Outbound DNS resolver policy. Empty/system keeps the OS resolver. Classic DNS
; must use an IP literal to avoid bootstrap DNS; HTTPS endpoints use DoH.
; Multiple endpoints inside one DNS entry are failover endpoints. Repeating DNS
; creates ordered resolver rules. DNS_Only limits the rule immediately above;
; DNS_Bypass sends matching domains to system/VPN DNS. Remote PAC URLs always
; bootstrap with system DNS so internal PAC servers remain reachable.
; Examples: 1.1.1.1, udp://1.1.1.1:53, tcp://1.1.1.1:53,
;           https://dns.example/dns-query
dns =
; dns_only = *.google.com
; dns_bypass = *.bosch.com,bosch.com

; Override or set the User-Agent header on forwarded HTTP requests.
useragent =

; Upstream proxy username or Kerberos principal.
username =

; Upstream auth mode. Supported values:
;   ANY, ANYSAFE, NEGOTIATE, NTLM, DIGEST, BASIC, NONE
; Selector forms are also supported, such as ONLYNTLM, NOBASIC, SAFENONTLM.
auth =

; Reserved compatibility flag. Unix ticket management is not currently wired
; to end-to-end upstream GSSAPI proxy authentication. Windows current-user
; SSPI authentication does not require this flag.
kerberos = 0

[client]

; Require authentication from local clients. Supported values:
;   NONE, ANY, ANYSAFE, NEGOTIATE, NTLM, DIGEST, BASIC
client_auth = NONE

; Username for local client authentication.
client_username =

; Compatibility setting retained from Python Px.
client_nosspi = 0

[settings]

; Compatibility settings retained for config parity.
workers = 1
threads = 32

; CONNECT tunnel idle timeout in seconds.
idle = 30

; Upstream socket timeout in seconds.
socktimeout = 20.0

; Seconds between PAC/system proxy reload checks.
proxyreload = 60

; Compatibility setting.
foreground = 0

; Automatic update policy:
;   off     = disabled (default)
;   notify  = periodically check and record availability only
;   install = periodically stage/verify and install through the owning provider
auto_update = off

; Positive Go duration between periodic checks. Startup is jittered.
update_interval = 24h

; Release channel. Stable is the safe default; prerelease requires explicit opt-in.
update_channel = stable

; Installation owner. Auto detects official WinGet/Scoop/Homebrew paths and
; otherwise treats the executable as a direct/portable install.
; Values: auto, direct, winget, scoop, homebrew
install_provider = auto

; Debug logging:
;   0 = disabled
;   1 = executable directory
;   2 = current working directory
;   3 = current working directory with unique filename
;   4 = stdout
log = 0

